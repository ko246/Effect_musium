<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Effect Museum</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/effects/effect-a.css') }}">
</head>

<body>
    <header>
        <nav>
            <!-- ロゴエリア：アイコン（エフェクト）＋テキスト -->
            <a href="#" class="nav-logo">
                <div class="nav-icon">
                    <div class="effect-a effect-a__orbit">
                        <div class="effect-a__ball"></div>
                        <div class="effect-a__ball"></div>
                        <div class="effect-a__ball"></div>
                        <div class="effect-a__ball"></div>
                        <div class="effect-a__ball"></div>
                        <div class="effect-a__ball"></div>
                        <div class="effect-a__center"></div>
                    </div>
                </div>
                <span class="nav-logo-text">Effect Museum</span>
            </a>

            <!-- ナビゲーションリンク -->
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Effect Lab</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- ヒーローセクション（説明欄） -->
        <section class="hero">
            <p class="hero-eyebrow">Test Web Site</p>
            <h1 class="hero-title">
                <span>Effect</span>
                <span>Museum</span>
            </h1>
            <p class="hero-desc">
                エフェクトの実験場です。<br>
                ご自由にご観覧ください。
            </p>

        </section>
        <!-- 誘導セクション -->
        <section class="navigate">
            <h2 class="navigate-title">Welcome Lab</h2>
        
            <div class="navigate-grid">
            
                <!-- エフェクトページへ -->
                <a href="#" class="navigate-card">
                    <p class="navigate-card-label">01</p>
                    <h3 class="navigate-card-title">Effect Lab</h3>
                    <p class="navigate-card-desc">
                        エフェクトの実験場。<br>
                        自作のエフェクトを展示しています。
                    </p>
                    <span class="navigate-card-btn">Enter →</span>
                </a>
            
                <!-- ハーバリウムページへ -->
                <a href="#" class="navigate-card">
                    <p class="navigate-card-label">02</p>
                    <h3 class="navigate-card-title">Herbarium</h3>
                    <p class="navigate-card-desc">
                        ハーバリウムの展示室。<br>
                        自作の作品を紹介しています。
                    </p>
                    <span class="navigate-card-btn">Enter →</span>
                </a>
            
            </div>
        </section>
    </main>


    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
